<header
  class="sticky top-0 z-[1200] bg-vicblue border-b-[3px] border-brass text-paper-light shadow-[0_4px_12px_rgba(0,0,0,0.3)]"
>
  <div class="mx-auto max-w-[1600px] px-4 sm:px-6 h-16 flex items-center gap-4">
    <a
      [routerLink]="'/explorar'"
      class="flex items-center gap-3 shrink-0 group text-left"
      [class.text-brass-light]="isExplorar()"
    >
      <span class="grid place-items-center w-9 h-9 rounded bg-vicblue-dark border border-brass">
        <svg lucideCompass class="w-5 h-5 text-brass-light transition-transform duration-700 group-hover:rotate-45"></svg>
      </span>
      <span class="leading-tight hidden sm:block">
        <span
          class="block font-display text-[17px] tracking-[0.15em] uppercase font-bold text-brass-light"
        >
          Hispania
        </span>
        <span class="block text-[10px] tracking-[0.25em] uppercase text-paper-dark italic">
          Atlas Cartográfico
        </span>
      </span>
    </a>

    <nav class="hidden lg:flex items-center gap-1 ml-6">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" [ngClass]="desktopLinkClass(item.path)">
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="ml-auto flex items-center gap-3">
      <app-search-box />
      <app-account-menu />
    </div>
  </div>

  <nav
    class="lg:hidden flex items-center gap-1 px-4 pb-2 overflow-x-auto bg-vicblue-dark border-t border-brass/20"
  >
    @for (item of navItems; track item.path) {
      <a [routerLink]="item.path" [ngClass]="mobileLinkClass(item.path)">
        {{ item.label }}
      </a>
    }
  </nav>
</header>
