<div class="mx-auto max-w-[1600px] px-4 sm:px-6 py-8">
  <h1 class="font-display text-4xl sm:text-5xl font-bold text-vicblue">
    Patrimonio y Academias
  </h1>

  <div class="flex gap-2 mt-8 overflow-x-auto pb-2 border-b border-paper-border">
    @for (cat of categorias; track cat) {
      <button type="button" (click)="setFiltro(cat)" [ngClass]="filterClass(cat)">
        {{ cat }}
      </button>
    }
  </div>

  <div class="mt-6 grid gap-5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
    @for (p of listaFiltrada(); track p.id) {
      <div
        class="bg-paper-light border border-paper-border overflow-hidden flex flex-col justify-between"
      >
        @if (p.img) {
          <img [src]="p.img" [alt]="p.name" class="w-full h-40 object-cover" />
        }

        <div class="p-5 flex flex-col justify-between flex-1">
          <div>
            <div
              class="flex items-center justify-between border-b border-paper-border pb-2 mb-3"
            >
              <span
                class="text-[10px] px-2 py-0.5 bg-paper-dark text-ink-muted border border-paper-border font-bold uppercase"
              >
                {{ p.category }}
              </span>
              <span class="text-[11px] text-brass-dark italic font-bold">{{ p.period }}</span>
            </div>
            <h3 class="font-display text-2xl font-bold text-vicblue leading-tight">{{ p.name }}</h3>
            <p class="text-[12px] text-ink-muted italic mt-1">{{ paisDe(p.country) }}</p>
            <p class="text-[13px] text-ink mt-3 leading-relaxed">{{ p.desc }}</p>
          </div>
          <button
            type="button"
            (click)="ubicarEnMapa(p.id)"
            class="mt-5 w-full py-2 bg-paper border border-brass text-ink font-bold text-[13px] hover:bg-brass/20"
          >
            Ubicar en Cartografía
          </button>
        </div>
      </div>
    } @empty {
      <p class="text-ink-muted italic text-[13px]">No hay lugares en esta categoría.</p>
    }
  </div>
</div>
