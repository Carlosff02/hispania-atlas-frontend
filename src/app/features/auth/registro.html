<div
  class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-12 bg-vicblue-dark"
>
  <div
    class="w-full max-w-md bg-vicblue border border-brass/40 rounded-sm shadow-[0_8px_24px_rgba(0,0,0,0.45)]"
  >
    <div class="px-8 pt-8 pb-2 text-center">
      <h1
        class="font-display text-2xl tracking-[0.15em] uppercase text-brass-light font-bold"
      >
        Crear cuenta
      </h1>
      <p class="mt-1 text-[11px] tracking-[0.25em] uppercase text-paper-dark italic">
        Atlas cartográfico
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="enviar()" class="px-8 py-6 space-y-4">
      <label class="block">
        <span class="block text-[11px] tracking-[0.2em] uppercase text-paper-dark mb-1.5"
          >Usuario</span
        >
        <input
          type="text"
          formControlName="username"
          autocomplete="username"
          placeholder="solo letras, números y guion bajo"
          class="w-full px-3 py-2.5 bg-vicblue-dark border border-brass/30 rounded-sm text-paper-light text-sm placeholder:text-paper-dark/50 focus:outline-none focus:border-brass"
        />
        @if (controlMarcado('username')) {
          <span class="block mt-1 text-[11px] text-red-300">
            Entre 3 y 30 caracteres, solo letras, números y guion bajo.
          </span>
        }
      </label>

      <label class="block">
        <span class="block text-[11px] tracking-[0.2em] uppercase text-paper-dark mb-1.5"
          >Nombre visible (opcional)</span
        >
        <input
          type="text"
          formControlName="nombre"
          autocomplete="name"
          placeholder="como te verán los colaboradores"
          class="w-full px-3 py-2.5 bg-vicblue-dark border border-brass/30 rounded-sm text-paper-light text-sm placeholder:text-paper-dark/50 focus:outline-none focus:border-brass"
        />
      </label>

      <label class="block">
        <span class="block text-[11px] tracking-[0.2em] uppercase text-paper-dark mb-1.5"
          >Email</span
        >
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="tu@correo.com"
          class="w-full px-3 py-2.5 bg-vicblue-dark border border-brass/30 rounded-sm text-paper-light text-sm placeholder:text-paper-dark/50 focus:outline-none focus:border-brass"
        />
        @if (controlMarcado('email')) {
          <span class="block mt-1 text-[11px] text-red-300">El email no es válido.</span>
        }
      </label>

      <div class="grid grid-cols-2 gap-3">
        <label class="block">
          <span class="block text-[11px] tracking-[0.2em] uppercase text-paper-dark mb-1.5"
            >Contraseña</span
          >
          <input
            type="password"
            formControlName="password"
            autocomplete="new-password"
            placeholder="mín. 8"
            class="w-full px-3 py-2.5 bg-vicblue-dark border border-brass/30 rounded-sm text-paper-light text-sm placeholder:text-paper-dark/50 focus:outline-none focus:border-brass"
          />
        </label>

        <label class="block">
          <span class="block text-[11px] tracking-[0.2em] uppercase text-paper-dark mb-1.5"
            >Repetir</span
          >
          <input
            type="password"
            formControlName="repetirPassword"
            autocomplete="new-password"
            placeholder="••••••••"
            class="w-full px-3 py-2.5 bg-vicblue-dark border border-brass/30 rounded-sm text-paper-light text-sm placeholder:text-paper-dark/50 focus:outline-none focus:border-brass"
          />
        </label>
      </div>
      @if (controlMarcado('password')) {
        <p class="text-[11px] text-red-300 -mt-2">La contraseña necesita al menos 8 caracteres.</p>
      }

      @if (error()) {
        <p
          class="text-xs text-red-300 border border-red-400/40 bg-red-900/20 rounded-sm px-3 py-2"
          role="alert"
        >
          {{ error() }}
        </p>
      }

      <button
        type="submit"
        [disabled]="submitting()"
        class="w-full py-2.5 bg-brass text-vicblue font-bold text-sm tracking-[0.15em] uppercase rounded-sm hover:bg-brass-light transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ submitting() ? 'Creando cuenta…' : 'Crear cuenta' }}
      </button>

      <p class="text-center text-xs text-paper-dark pt-1">
        ¿Ya tienes cuenta?
        <a routerLink="/cuenta/entrar" class="text-brass-light hover:underline font-semibold"
          >Entrar</a
        >
      </p>
    </form>
  </div>
</div>
