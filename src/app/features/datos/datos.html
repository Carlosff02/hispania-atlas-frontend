<div class="mx-auto max-w-[1600px] px-4 sm:px-6 py-8">
  <h1 class="font-display text-4xl sm:text-5xl font-bold text-vicblue">
    Registros Macroeconómicos
  </h1>

  <div class="mt-8 grid gap-4 lg:grid-cols-[1fr_auto]">
    <div class="border-2 border-paper-border bg-paper-light p-4">
      <div class="text-[10px] uppercase text-ink-muted mb-3 font-bold">
        Naciones en comparación
      </div>
      <div class="flex flex-wrap gap-2">
        @for (c of paises(); track c.code) {
          <button type="button" (click)="toggleCountry(c.code)" [ngClass]="countryClass(c.code)">
            {{ c.name }}
          </button>
        }
      </div>
    </div>

    <div class="border-2 border-paper-border bg-paper-light p-4 lg:w-[280px]">
      <div class="text-[10px] uppercase text-ink-muted mb-3 font-bold">Métrica activa</div>
      <div class="flex flex-wrap gap-2">
        @for (ind of indicadores; track ind.id) {
          <button
            type="button"
            (click)="selectIndicator(ind.id)"
            [ngClass]="indicatorClass(ind.id)"
          >
            {{ ind.label }}
          </button>
        }
      </div>
    </div>
  </div>

  <div class="mt-4 grid gap-4 grid-cols-2 sm:grid-cols-4">
    @for (c of paisesActivos(); track c.code) {
      <div class="border border-paper-border bg-paper-light p-4">
        <div class="text-[11px] text-ink-muted font-bold uppercase">{{ c.name }}</div>
        <div class="text-2xl font-display font-bold text-vicblue mt-1">{{ valor(c) }}</div>
      </div>
    }
  </div>

  <div class="mt-4 border-2 border-brass bg-paper-light p-6">
    <div class="h-[350px] relative">
      <app-line-chart [data]="lineData()" />
    </div>
  </div>
</div>
